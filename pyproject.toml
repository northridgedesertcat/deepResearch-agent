[project]
name = "deep-research-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-openai",
    "pydantic-settings",
    "python-dotenv",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: end-to-end agent quality evals (slow, costs LLM calls)"]

[tool.ruff]
target-version = "py311"
line-length = 100
